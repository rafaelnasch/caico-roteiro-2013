<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#172B3D">
<meta name="portal-iv" content="2SSTJiVUp4BI8IAh">
<title>Roteiro: de 2013 ao 8 de janeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#172B3D;--accent:#244460;--orange:#c9a24d;--paper:#F7F9FB;--display:'Newsreader',serif;--body:'Lexend',sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;color:var(--ink);background:var(--paper);font-family:var(--body);font-size:18px}
iframe{display:block;border:0;width:100%;height:100vh;height:100dvh;background:var(--paper)}[hidden]{display:none!important}
.state{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;padding:24px 16px}.message{max-width:540px;width:100%;border-top:3px solid var(--orange);padding-top:24px}.message .label{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase}.message h1{font:600 32px/1.25 var(--display);letter-spacing:-1px;margin:16px 0}.message p{font-size:18px;line-height:1.65;margin:0;overflow-wrap:anywhere}
@media(max-width:600px){.message h1{font-size:28px}.message p{font-size:17px}}
</style>
</head>
<body>
<main class="state" id="state" aria-live="polite"><div class="message"><div class="label">Caico Borelli</div><h1 id="state-title">Abrindo o documento</h1><p id="state-text">Aguarde um instante.</p><noscript>Ative o JavaScript para abrir o conteúdo protegido.</noscript></div></main>
<iframe id="content" title="Roteiro do vídeo" hidden sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads" referrerpolicy="no-referrer"></iframe>
<script src="/caico-roteiro-2013/app.js"></script>
</body>
</html>
